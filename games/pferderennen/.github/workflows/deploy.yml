name: Deploy to GitHub Pages

# Only after CI has gone green on main. A red fairness audit must never reach the live site,
# which is why this waits for the whole check job rather than running in parallel with it.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # Lets the first deploy be triggered by hand, before any CI run exists to hang off.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push wins, but a running one is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build the site and publish it
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_run starts from the default branch, so the commit CI passed on is named here.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # There is no build. This only picks out what the browser actually needs, so that
      # node_modules, tests and coverage reports do not end up on a public site.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js README.md _site/
          cp -r src assets docs _site/
          # Tells Pages not to run Jekyll, which would swallow files starting with an underscore.
          touch _site/.nojekyll

      - name: Check that nothing links to an absolute path
        run: |
          # The site lives under /Pferderennen/, so every path has to be relative.
          if grep -rnE '(src|href)="/[^/]' _site/index.html _site/src; then
            echo "Absolute Pfade gefunden – unter /Pferderennen/ würden sie ins Leere zeigen."
            exit 1
          fi

      # Schlägt mit "Get Pages site failed" fehl, solange Pages im Repo nicht aktiviert ist.
      # Einmalig nötig: Settings → Pages → Source = "GitHub Actions"
      # (oder: gh api -X POST repos/lukabpunkt/Pferderennen/pages -f build_type=workflow).
      # Bewusst nicht `enablement: true` – eine Seite öffentlich zu schalten ist eine
      # Entscheidung, die der Mensch trifft, nicht ein Workflow nebenbei.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
