name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint, tests & fairness audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The service worker's precache list is generated. A stale one means a game that is only
      # almost playable offline, which is worse than one that is obviously not.
      - name: Service-worker precache list is current
        run: |
          npm run sw
          git diff --exit-code sw.js

      # Mandatory gate: no merge unless fairness is proven. 100k main races plus four
      # comparison batches of 30k, spread across the runner's cores.
      - name: Fairness audit (220k races)
        run: npm run audit:fairness -- --n=100000 --sub=30000 --verify-partition

      - name: E2E smoke tests
        if: hashFiles('tests/e2e/**/*.spec.js') != ''
        run: |
          npx playwright install --with-deps chromium webkit
          npm run e2e
