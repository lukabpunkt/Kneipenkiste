<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'"
    />
    <meta name="theme-color" content="#FFB88C" />
    <meta
      name="description"
      content="Pferderennen – ein faires Trinkspiel-Pferderennen für den Browser. Sechs Pferde, ein Gerät, viele Schlücke."
    />
    <title>Pferderennen</title>

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icons/icon-192.png" sizes="192x192" type="image/png" />
    <!-- iOS ignores the manifest and looks for these three. -->
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pferderennen" />

    <!--
      The display face, ahead of the stylesheets that ask for it. `crossorigin` is required even
      for a same-origin font: without it the preload is discarded and the file is fetched twice.
    -->
    <link
      rel="preload"
      href="./assets/fonts/fredoka-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="stylesheet" href="./src/styles/tokens.css" />
    <link rel="stylesheet" href="./src/styles/base.css" />
    <link rel="stylesheet" href="./src/styles/components.css" />
    <link rel="stylesheet" href="./src/styles/screens.css" />
    <link rel="stylesheet" href="./src/styles/race.css" />
  </head>
  <body>
    <!-- All screens, menus and the HUD live here as DOM. -->
    <main id="app"></main>

    <!-- Announces the start, lead changes, photo finish and result to screen readers. -->
    <div id="live-region" class="visually-hidden" role="status" aria-live="polite"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
