<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Der Zoll</title>
  <!--
    App-Icon: der Röntgen-Moment (Art Direction, Design-Priorität 4).
    Ein Koffer als Silhouette auf dem Scanner-Monitor, darin eine Ente — die
    Schmuggelware ist immer albern. Farben aus config/theme.ts: xrayBg, xrayGlow,
    xrayDim, customs. Dicke ink-Outlines, Cel-Shading, kein Verlauf.
    Quelle für public/icons/* — gebaut mit `npm run build:icons`.
  -->
  <rect width="512" height="512" fill="#0F0E1A" />

  <!-- Monitorgehäuse -->
  <rect x="46" y="66" width="420" height="330" rx="34" fill="#1A1024" />
  <rect x="58" y="78" width="396" height="306" rx="26" fill="#8C93A8" />
  <!-- Cel-Shading: harte Kante unten rechts -->
  <path d="M454 200 V358 a26 26 0 0 1 -26 26 H200 Z" fill="#4A506A" opacity="0.55" />

  <!-- Bildschirm -->
  <rect x="84" y="104" width="344" height="254" rx="14" fill="#1A1024" />
  <rect x="92" y="112" width="328" height="238" rx="10" fill="#0B2233" />

  <!-- Koffer-Silhouette im Röntgenlicht -->
  <g stroke="#3DF5C6" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- Griff -->
    <path d="M216 176 v-22 a12 12 0 0 1 12 -12 h56 a12 12 0 0 1 12 12 v22" />
    <!-- Schale -->
    <rect x="136" y="176" width="240" height="140" rx="20" fill="#1A6B5C" fill-opacity="0.55" />
    <!-- Schließen -->
    <line x1="176" y1="176" x2="176" y2="316" />
    <line x1="336" y1="176" x2="336" y2="316" />
  </g>

  <!-- Die Ente: hell, weil dicht — das ist der Moment, in dem alle hinschauen -->
  <g fill="#3DF5C6">
    <ellipse cx="252" cy="268" rx="46" ry="26" />
    <circle cx="288" cy="234" r="22" />
    <path d="M306 232 l30 8 -30 10 z" />
    <path d="M214 258 q-22 -10 -14 -30 q10 12 30 16 z" />
  </g>
  <circle cx="296" cy="230" r="4" fill="#0B2233" />

  <!-- Scanline: die Zeile, die gerade das Bild aufbaut -->
  <rect x="92" y="216" width="328" height="6" fill="#3DF5C6" opacity="0.9" />
  <rect x="92" y="222" width="328" height="18" fill="#3DF5C6" opacity="0.14" />

  <!-- Standfuß -->
  <rect x="216" y="396" width="80" height="26" fill="#1A1024" />
  <rect x="146" y="418" width="220" height="34" rx="12" fill="#1A1024" />
  <rect x="154" y="426" width="204" height="18" rx="8" fill="#4A506A" />

  <!-- Zoll-Stempel: das Signal des Beamten, in seiner Farbe -->
  <g transform="translate(404 350) rotate(-14)">
    <circle r="54" fill="#1A1024" />
    <circle r="44" fill="#FFB800" />
    <circle r="44" fill="none" stroke="#D18E00" stroke-width="6" />
    <circle r="30" fill="none" stroke="#1A1024" stroke-width="6" />
    <path d="M-14 2 l10 10 l20 -22" fill="none" stroke="#1A1024" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
