<?xml version="1.0" encoding="UTF-8"?>
<!-- Zahlenkranz. Dreht sich beim Öffnen dreimal mit Klick-Sound (GDD §4.3).
     Eigener Sprite, damit er unabhängig vom Griffrad laufen kann. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <circle cx="80" cy="80" r="70" fill="none" stroke="#1A1024" stroke-width="6"/>
  <g stroke="#1A1024" stroke-width="5" stroke-linecap="round">
    <line x1="80" y1="12" x2="80" y2="26"/>
    <line x1="114" y1="21" x2="107" y2="33"/>
    <line x1="139" y1="46" x2="127" y2="53"/>
    <line x1="148" y1="80" x2="134" y2="80"/>
    <line x1="139" y1="114" x2="127" y2="107"/>
    <line x1="114" y1="139" x2="107" y2="127"/>
    <line x1="80" y1="148" x2="80" y2="134"/>
    <line x1="46" y1="139" x2="53" y2="127"/>
    <line x1="21" y1="114" x2="33" y2="107"/>
    <line x1="12" y1="80" x2="26" y2="80"/>
    <line x1="21" y1="46" x2="33" y2="53"/>
    <line x1="46" y1="21" x2="53" y2="33"/>
  </g>
  <!-- Die Markierung, an der man ablesen kann, dass sich etwas dreht -->
  <circle cx="80" cy="19" r="7" fill="#FFC93C" stroke="#1A1024" stroke-width="5"/>
</svg>
