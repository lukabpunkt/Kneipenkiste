  <defs>
    <radialGradient id="vig">
      <stop offset="52%" stop-color="#0B0A14" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B0A14" stop-opacity="0.92"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#vig)"/>
</svg>
