<!-- Domino-Maske (Art Direction §5). Weiss = wird in Spielerfarbe getintet.
     Die Augenlöcher sind echte Löcher (evenodd), damit die Augen darunter sichtbar
     bleiben — der Crook ist maskiert, nicht blind. Sitzt über dem Gesichts-Slot. -->
