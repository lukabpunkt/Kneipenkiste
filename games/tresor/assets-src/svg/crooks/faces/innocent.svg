<?xml version="1.0" encoding="UTF-8"?>
<!-- Gesicht "innocent" — große Augen nach oben, gespitzter Mund (Pfeifen).
     Das Gesicht nach dem Flip einer TEILEN-Karte. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" width="96" height="64">
  <ellipse cx="27" cy="24" rx="14" ry="16" fill="#FFFFFF" stroke="#1A1024" stroke-width="5"/>
  <ellipse cx="69" cy="24" rx="14" ry="16" fill="#FFFFFF" stroke="#1A1024" stroke-width="5"/>
  <!-- Pupillen oben: der Blick geht zur Decke -->
  <circle cx="28" cy="17" r="6" fill="#1A1024"/>
  <circle cx="70" cy="17" r="6" fill="#1A1024"/>
  <!-- Gespitzter Mund -->
  <ellipse cx="48" cy="52" rx="7" ry="6" fill="#1A1024"/>
</svg>
