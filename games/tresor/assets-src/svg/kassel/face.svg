<?xml version="1.0" encoding="UTF-8"?>
<!-- Kassels Gesicht: Monokel links, Schnurrbart, freundlich-unbeteiligt.
     Ein eigenes Gesicht statt Overlays — er wechselt seinen Ausdruck nie. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" width="96" height="64">
  <ellipse cx="27" cy="24" rx="13" ry="15" fill="#FFFFFF" stroke="#1A1024" stroke-width="5"/>
  <ellipse cx="69" cy="24" rx="13" ry="15" fill="#FFFFFF" stroke="#1A1024" stroke-width="5"/>
  <circle cx="28" cy="27" r="6" fill="#1A1024"/>
  <circle cx="70" cy="27" r="6" fill="#1A1024"/>
  <!-- Monokel über dem rechten Auge, mit Kettchen nach unten -->
  <circle cx="69" cy="24" r="19" fill="none" stroke="#FFC93C" stroke-width="4"/>
  <path d="M85 34 Q90 46 84 54" stroke="#FFC93C" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Schnurrbart -->
  <path d="M48 46 Q34 40 24 48 Q34 54 48 48 Q62 54 72 48 Q62 40 48 46 Z"
        fill="#4A506A" stroke="#1A1024" stroke-width="4" stroke-linejoin="round"/>
</svg>
