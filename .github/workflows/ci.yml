name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (max. 5 Warnings, Standing Audit)
        run: npm run lint -- --max-warnings 5

      - name: Kontrast der Textfarben (Audit A5)
        run: npm run check:contrast

      - name: Unit-Tests mit Coverage
        run: npm run test:coverage

      - name: Informationssicherheit (Standing Audit)
        # Kein Screen und kein Director greift an `publicView` vorbei auf die Runde zu.
        # `publicView.test.ts` prueft dasselbe genauer (inkl. erlaubtem Reveal); hier
        # steht die grobe Variante als eigener, sofort lesbarer Schritt.
        run: |
          if grep -rnE '\.packs\b|context\.round\b' src/ui src/game 2>/dev/null; then
            echo "::error::Ein Screen oder Director greift direkt auf die Runde zu."
            exit 1
          fi
          echo "OK — Screens sehen nur publicView."

      - name: Kein Math.random im Regelkern (Audit A0)
        run: |
          if grep -rn 'Math\.random' src/core --include='*.ts' \
             | grep -v '^\s*\*' | grep -vE '^\S+: *(\*|//)'; then
            echo "::error::Math.random in src/core/ — nutze core/rng.ts."
            exit 1
          fi
          echo "OK — der Regelkern wuerfelt ueber crypto."

      - name: Build
        run: npm run build

      - name: Bundle-Groesse melden (Standing Audit)
        run: |
          echo "### Bundle (gzip)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find dist/assets -name '*.js' -print0 | while IFS= read -r -d '' file; do
            printf '%-48s %6s KB\n' "$(basename "$file")" "$(gzip -c "$file" | wc -c | awk '{printf "%.1f", $1/1024}')" >> "$GITHUB_STEP_SUMMARY"
          done
          total=$(find dist/assets -name '*.js' -exec cat {} + | gzip -c | wc -c)
          printf '%-48s %6s KB\n' "GESAMT JS" "$(awk -v b="$total" 'BEGIN{printf "%.1f", b/1024}')" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Bundle-Budget durchsetzen (Audit A5)
        run: |
          # Summe der einzeln gzippten Dateien — so kommen sie auch beim Geraet an.
          total=0
          for file in dist/assets/*.js dist/*.js; do
            [ -f "$file" ] || continue
            total=$((total + $(gzip -c "$file" | wc -c)))
          done
          limit=$((450 * 1024))
          echo "JS gzip: $((total / 1024)) KB (Grenze $((limit / 1024)) KB)"
          if [ "$total" -gt "$limit" ]; then
            echo "::error::JS-Bundle ueberschreitet das A5-Budget."
            exit 1
          fi

      - name: Coverage-Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E (Mobile-Emulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Playwright-Browser installieren
        # iPhone 12 laeuft unter WebKit (Safari-Referenz), Pixel 5 unter Chromium.
        run: npx playwright install --with-deps chromium webkit

      - name: E2E-Flow
        run: npm run test:e2e

      - name: Sequenzen und Polish (Audits A3–A5)
        run: npx playwright test tests/e2e/hints.spec.ts tests/e2e/xray.spec.ts tests/e2e/polish.spec.ts --project="Pixel 5"

      - name: Performance und Interaktion (Audit A2)
        # Der Frame-Zeit-Test überspringt sich selbst, wenn der Runner ohne GPU per
        # SwiftShader rendert; Draw-Calls, JS-Zeit und Heap werden trotzdem geprüft.
        run: npm run test:perf

  lighthouse:
    name: Lighthouse (Audit A5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Preview starten
        run: |
          npm run preview -- --port 4173 --strictPort &
          npx wait-on http://127.0.0.1:4173/Zoll/ --timeout 60000

      - name: Perf / A11y / Best Practices ≥ 90
        run: npm run check:lighthouse

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
