name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (max. 5 Warnings, Standing Audit)
        run: npm run lint -- --max-warnings 5

      - name: Unit-Tests mit Coverage
        # Die Schwellen stehen in vitest.config.ts: core/ >= 95 %, fsm.ts = 100 %.
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle-Groesse melden (Standing Audit)
        run: |
          echo "### Bundle (gzip)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find dist/assets -name '*.js' -print0 | while IFS= read -r -d '' file; do
            printf '%-48s %6s KB\n' "$(basename "$file")" "$(gzip -c "$file" | wc -c | awk '{printf "%.1f", $1/1024}')" >> "$GITHUB_STEP_SUMMARY"
          done
          total=$(find dist/assets -name '*.js' -exec cat {} + | gzip -c | wc -c)
          printf '%-48s %6s KB\n' "GESAMT JS" "$(awk -v b="$total" 'BEGIN{printf "%.1f", b/1024}')" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Bundle-Budget durchsetzen (Architektur §1, Audit A5)
        run: |
          # Summe der einzeln gzippten Dateien — so kommen sie auch beim Geraet an.
          total=0
          for file in dist/assets/*.js dist/*.js; do
            [ -f "$file" ] || continue
            total=$((total + $(gzip -c "$file" | wc -c)))
          done
          limit=$((450 * 1024))
          echo "JS gzip: $((total / 1024)) KB (Grenze $((limit / 1024)) KB)"
          if [ "$total" -gt "$limit" ]; then
            echo "::error::JS-Bundle ueberschreitet das Budget aus Architektur §1."
            exit 1
          fi
          # TODO(M5.5): pruefen, dass der Board-Chunk lazy geladen wird und nicht in index.html steht.

      # Der Test-Seed macht die Kistenposition vorhersagbar — im Deploy-Build waere das
      # das Ende des Spiels: `?seed=1` an die Live-URL, und jeder weiss, wo die Kiste
      # liegt. Der Zweig faellt nur dann weg, wenn `import.meta.env` in Punkt-Notation
      # gelesen wird (siehe src/vite-env.d.ts) — was hier nachgeprueft wird.
      - name: Kein Test-Seed im Deploy-Build (ADR-11)
        run: |
          if grep -rlE "(get|has)\([\"']seed[\"']\)" dist/assets/*.js; then
            echo "::error::Der ?seed=-Hook ist im Produktions-Build gelandet."
            exit 1
          fi
          echo "✓ Der Test-Seed existiert nur im Dev- und E2E-Build"

      - name: Coverage-Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  info-security:
    name: Informationssicherheit (CLAUDE.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Zwei Regeln, die das Spiel tragen — hier noch einmal ausserhalb der Testsuite,
      # damit sie auch dann greifen, wenn jemand einen Test loescht.
      # Kommentarzeilen sind erlaubt — beide Regeln werden im Code selbst erklaert.
      - name: Kein Math.random in src/core/
        run: |
          if grep -rn 'Math\.random' src/core/ | grep -vE ':[0-9]+:[[:space:]]*(\*|//|/\*)'; then
            echo "::error::Math.random ist in src/core/ verboten — nutze core/rng.ts (CLAUDE.md)."
            exit 1
          fi
          echo "✓ src/core/ nutzt ausschliesslich core/rng.ts"

      # `context.board` ist der einzige Weg zum privaten Board — wer ihn nicht gehen
      # kann, kommt an `mines` gar nicht heran. Bewusst erlaubt bleiben `.treasure`
      # (ReplayCell, kommt aus replayView) und `.board` (die PIXI-Buehne).
      - name: Kein Screen sieht das private Board
        run: |
          if grep -rn --include='*.ts' -E 'context\.board\b|[Bb]oard\.(mines|treasure)\b|\{ *(mines|treasure) *[,}]' \
               src/ui src/game 2>/dev/null \
             | grep -vE ':[0-9]+:[[:space:]]*(\*|//|/\*)'; then
            echo "::error::Screens duerfen nur fsm.view() / placeViewFor() / replay() sehen (ADR-2)."
            exit 1
          fi
          echo "✓ Das private Board bleibt im Store"

  e2e:
    name: E2E (Mobile-Emulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      # Beide Engines: Das iPhone-12-Profil laeuft unter WebKit, Pixel 5 unter Chromium.
      # Mit `chromium` allein scheitern die 25 iPhone-Tests am fehlenden Browser, nicht
      # an einer Regression — und das sieht in der Log-Ausgabe fast gleich aus.
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium webkit

      - name: E2E (iPhone 12 + Pixel 5)
        run: npm run test:e2e

      - name: Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
