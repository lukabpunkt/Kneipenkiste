name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (max. 5 Warnings, Standing Audit)
        run: npm run lint -- --max-warnings 5

      - name: Unit-Tests mit Coverage
        # Die Schwellen stehen in vitest.config.ts: core/ >= 95 %, fsm.ts = 100 %.
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle-Groesse melden (Standing Audit)
        run: |
          echo "### Bundle (gzip)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find dist/assets -name '*.js' -print0 | while IFS= read -r -d '' file; do
            printf '%-48s %6s KB\n' "$(basename "$file")" "$(gzip -c "$file" | wc -c | awk '{printf "%.1f", $1/1024}')" >> "$GITHUB_STEP_SUMMARY"
          done
          total=$(find dist/assets -name '*.js' -exec cat {} + | gzip -c | wc -c)
          printf '%-48s %6s KB\n' "GESAMT JS" "$(awk -v b="$total" 'BEGIN{printf "%.1f", b/1024}')" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Bundle-Budget durchsetzen (Architektur §1, Audit A5)
        run: |
          # Summe der einzeln gzippten Dateien — so kommen sie auch beim Geraet an.
          total=0
          for file in dist/assets/*.js dist/*.js; do
            [ -f "$file" ] || continue
            total=$((total + $(gzip -c "$file" | wc -c)))
          done
          limit=$((450 * 1024))
          echo "JS gzip: $((total / 1024)) KB (Grenze $((limit / 1024)) KB)"
          if [ "$total" -gt "$limit" ]; then
            echo "::error::JS-Bundle ueberschreitet das Budget aus Architektur §1."
            exit 1
          fi
          # TODO(M5.5): pruefen, dass der Board-Chunk lazy geladen wird und nicht in index.html steht.

      - name: Coverage-Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  info-security:
    name: Informationssicherheit (CLAUDE.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Zwei Regeln, die das Spiel tragen — hier noch einmal ausserhalb der Testsuite,
      # damit sie auch dann greifen, wenn jemand einen Test loescht.
      # Kommentarzeilen sind erlaubt — beide Regeln werden im Code selbst erklaert.
      - name: Kein Math.random in src/core/
        run: |
          if grep -rn 'Math\.random' src/core/ | grep -vE ':[0-9]+:[[:space:]]*(\*|//|/\*)'; then
            echo "::error::Math.random ist in src/core/ verboten — nutze core/rng.ts (CLAUDE.md)."
            exit 1
          fi
          echo "✓ src/core/ nutzt ausschliesslich core/rng.ts"

      - name: Kein Screen sieht board.mines oder board.treasure
        run: |
          if grep -rn --include='*.ts' -E '\.(mines|treasure)\b' src/ui src/game 2>/dev/null \
             | grep -vE ':[0-9]+:[[:space:]]*(\*|//|/\*)'; then
            echo "::error::Screens duerfen nur publicView()/replayView() sehen (ADR-2)."
            exit 1
          fi
          echo "✓ Das private Board bleibt im Store"

  e2e:
    name: E2E (Mobile-Emulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: E2E (iPhone 12 + Pixel 5)
        run: npm run test:e2e

      - name: Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
