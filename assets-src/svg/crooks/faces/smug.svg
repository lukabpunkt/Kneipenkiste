<?xml version="1.0" encoding="UTF-8"?>
<!-- Gesicht "smug" — halb geschlossene Augen, eine hochgezogene Braue, schiefes Grinsen.
     Das Gesicht nach dem Flip einer STEHLEN-Karte (Art Direction §7, Blick-Regie). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" width="96" height="64">
  <ellipse cx="27" cy="26" rx="13" ry="15" fill="#FFFFFF" stroke="#1A1024" stroke-width="5"/>
  <ellipse cx="69" cy="26" rx="13" ry="15" fill="#FFFFFF" stroke="#1A1024" stroke-width="5"/>
  <circle cx="29" cy="29" r="6" fill="#1A1024"/>
  <circle cx="71" cy="29" r="6" fill="#1A1024"/>
  <!-- Lider: halb zu, das macht den ganzen Ausdruck -->
  <path d="M15 22 Q27 16 40 22 L40 12 L15 12 Z" fill="#1A1024"/>
  <path d="M57 22 Q69 16 82 22 L82 12 L57 12 Z" fill="#1A1024"/>
  <!-- Hochgezogene Braue rechts -->
  <path d="M58 8 Q69 1 82 6" stroke="#1A1024" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Schiefes Grinsen -->
  <path d="M36 50 Q48 58 62 46" stroke="#1A1024" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
