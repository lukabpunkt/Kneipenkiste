<?xml version="1.0" encoding="UTF-8"?>
<!-- Bauhelm (Art Direction §5): sitzt im Hut-Slot, wird in **Spielerfarbe** getintet.
     Deshalb ist die Schale weiss — der ink-Streifen und die Krempe bleiben dunkel.
     Diggers tragen ihn immer; er ist der Traeger der Spielerfarbe. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 72" width="112" height="72">
  <g transform="translate(0 14)">
    <path d="M20 46 C20 20 35 6 56 6 C77 6 92 20 92 46 Z"
          fill="#FFFFFF" stroke="#1A1024" stroke-width="8" stroke-linejoin="round"/>
    <!-- Mittelgrat -->
    <path d="M56 8 L56 46" stroke="#1A1024" stroke-width="7" stroke-linecap="round"/>
    <!-- Krempe, breiter als die Schale -->
    <path d="M8 48 L104 48" stroke="#1A1024" stroke-width="12" stroke-linecap="round"/>
    <!-- Cel-Stufe rechts -->
    <path d="M56 6 C77 6 92 20 92 46 L56 46 Z" fill="#1A1024" opacity="0.18"/>
  </g>
</svg>
