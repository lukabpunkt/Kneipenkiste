    <line x1="64" y1="0" x2="64" y2="128"/>
  </g>
  <g fill="#262345">
    <circle cx="16" cy="16" r="4"/>
    <circle cx="112" cy="16" r="4"/>
    <circle cx="16" cy="112" r="4"/>
    <circle cx="112" cy="112" r="4"/>
    <circle cx="80" cy="80" r="4"/>
    <circle cx="48" cy="48" r="4"/>
