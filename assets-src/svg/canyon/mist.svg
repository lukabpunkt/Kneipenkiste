  <defs>
    <radialGradient id="mistFade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#DCE3F0" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#DCE3F0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#DCE3F0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="256" cy="64" rx="250" ry="54" fill="url(#mistFade)"/>
  <ellipse cx="150" cy="72" rx="120" ry="34" fill="url(#mistFade)"/>
