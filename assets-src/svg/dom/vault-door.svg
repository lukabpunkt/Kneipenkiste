<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="vault__svg" role="img">
  <!--
    Tresortür von vorn (Art Direction §4.2).

    Die DOM-Variante des Tresor-Widgets (Architektur §8). Negotiation- und
    Result-Screen binden diese Datei per `?raw` ein und animieren die Teile mit CSS;
    deshalb trägt jedes bewegliche Teil eine Klasse.

    Die PIXI-Variante auf der Bühne besteht aus Einzelsprites (frame, leaf, dial,
    wheel, coins1..5) — sie muss aufschwingen, was ein einzelnes SVG nicht kann.
    Deshalb liegt diese Datei bewusst außerhalb der Atlas-Kategorien.
  -->
  <defs>
    <clipPath id="vaultWindow">
      <circle cx="100" cy="100" r="60" />
    </clipPath>
  </defs>

  <!-- Rahmen und Türblatt -->
  <circle cx="100" cy="100" r="94" fill="#1A1024" />
  <circle cx="100" cy="100" r="88" fill="#8C93A8" />
  <path class="vault__shade" d="M100 12 A88 88 0 0 1 100 188 Z" fill="#4A506A" opacity="0.45" />

  <!-- Nietenkranz -->
  <g class="vault__rivets" fill="#4A506A" stroke="#1A1024" stroke-width="3">
    <circle cx="100" cy="27" r="6" />
    <circle cx="152" cy="48" r="6" />
    <circle cx="173" cy="100" r="6" />
    <circle cx="152" cy="152" r="6" />
    <circle cx="100" cy="173" r="6" />
    <circle cx="48" cy="152" r="6" />
    <circle cx="27" cy="100" r="6" />
    <circle cx="48" cy="48" r="6" />
  </g>

  <!-- Münzfenster: der Pegel steigt mit dem Tresorinhalt -->
  <g clip-path="url(#vaultWindow)">
    <circle cx="100" cy="100" r="60" fill="#0B0A14" />
    <!--
      Der Stapel steht in Ruhelage (fill = 1) randvoll im Fenster; die CSS-Variable
      Die CSS-Variable `vault-fill` schiebt ihn nach unten aus dem Sichtfeld,
      wenn der Tresor leerer ist.
    -->
    <g class="vault__coins">
      <rect x="34" y="104" width="132" height="80" fill="#FFC93C" />
      <ellipse cx="58" cy="104" rx="22" ry="8" fill="#FFC93C" />
      <ellipse cx="100" cy="98" rx="26" ry="9" fill="#FFC93C" />
      <ellipse cx="142" cy="105" rx="22" ry="8" fill="#FFC93C" />
      <ellipse cx="76" cy="92" rx="16" ry="6" fill="#C9961A" />
      <ellipse cx="124" cy="93" rx="16" ry="6" fill="#C9961A" />
      <ellipse cx="100" cy="82" rx="13" ry="5" fill="#C9961A" />
    </g>
  </g>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#1A1024" stroke-width="10" />

  <!-- Zahlenrad -->
  <g class="vault__dial" stroke="#1A1024" stroke-width="3" stroke-linecap="round">
    <line x1="100" y1="46" x2="100" y2="54" />
    <line x1="127" y1="53" x2="123" y2="60" />
    <line x1="147" y1="73" x2="140" y2="77" />
    <line x1="154" y1="100" x2="146" y2="100" />
    <line x1="147" y1="127" x2="140" y2="123" />
    <line x1="127" y1="147" x2="123" y2="140" />
    <line x1="100" y1="154" x2="100" y2="146" />
    <line x1="73" y1="147" x2="77" y2="140" />
    <line x1="53" y1="127" x2="60" y2="123" />
    <line x1="46" y1="100" x2="54" y2="100" />
    <line x1="53" y1="73" x2="60" y2="77" />
    <line x1="73" y1="53" x2="77" y2="60" />
  </g>

  <!-- Griffrad -->
  <g class="vault__wheel">
    <g stroke="#1A1024" stroke-width="14" stroke-linecap="round">
      <line x1="100" y1="62" x2="100" y2="138" />
      <line x1="62" y1="100" x2="138" y2="100" />
      <line x1="73" y1="73" x2="127" y2="127" />
      <line x1="127" y1="73" x2="73" y2="127" />
    </g>
    <g stroke="#FFC93C" stroke-width="7" stroke-linecap="round">
      <line x1="100" y1="62" x2="100" y2="138" />
      <line x1="62" y1="100" x2="138" y2="100" />
      <line x1="73" y1="73" x2="127" y2="127" />
      <line x1="127" y1="73" x2="73" y2="127" />
    </g>
    <circle cx="100" cy="100" r="20" fill="#1A1024" />
    <circle cx="100" cy="100" r="15" fill="#FFC93C" />
    <circle cx="100" cy="100" r="6" fill="#C9961A" />
  </g>
</svg>
