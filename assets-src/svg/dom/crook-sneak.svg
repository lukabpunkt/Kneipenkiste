<?xml version="1.0" encoding="UTF-8"?>
<!--
  Der schleichende Crook fuer den Title-Loop (GDD §5, Screen 0).

  Bewusst eine eigene DOM-SVG und kein Atlas-Frame: Der Title-Screen ist DOM
  (CLAUDE.md), und PixiJS nur fuer eine Silhouette zu starten waere die teuerste
  Animation im ganzen Spiel. Die Teile tragen Klassen, damit CSS Beine, Arme und Kopf
  einzeln bewegen kann — ein Crook, der als Block ueber den Schirm gleitet, schleicht
  nicht, er faehrt.

  Er ist absichtlich dunkel gehalten (Tinte plus ein Hauch Samt): Auf dem Title steht er
  im Halbdunkel, bis ihn der Spot erwischt.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <g class="sneak__legs" fill="#2a1b3d" stroke="#1A1024" stroke-width="6" stroke-linejoin="round">
    <rect class="sneak__legBack" x="58" y="128" width="20" height="52" rx="10"/>
    <rect class="sneak__legFront" x="86" y="128" width="20" height="52" rx="10"/>
  </g>
  <g class="sneak__feet" fill="#1A1024">
    <rect x="50" y="174" width="34" height="14" rx="7"/>
    <rect x="82" y="174" width="34" height="14" rx="7"/>
  </g>

  <!-- Torso, leicht nach vorn gebeugt: Das ist die halbe Miete beim Schleichen. -->
  <path class="sneak__torso" d="M56 74h52a14 14 0 0 1 14 14v34a14 14 0 0 1-14 14H56a14 14 0 0 1-14-14V88a14 14 0 0 1 14-14z"
        fill="#3a2450" stroke="#1A1024" stroke-width="7" stroke-linejoin="round"/>

  <!-- Der Geldsack in der vorderen Hand. -->
  <g class="sneak__bag">
    <path d="M118 108c14-6 28 2 28 16s-12 22-24 20-16-12-14-22z"
          fill="#c9961a" stroke="#1A1024" stroke-width="7" stroke-linejoin="round"/>
    <path d="M124 106l6-10 12 4-4 10z" fill="#8c93a8" stroke="#1A1024" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <g class="sneak__arm" fill="#3a2450" stroke="#1A1024" stroke-width="6" stroke-linejoin="round">
    <rect x="100" y="92" width="18" height="40" rx="9"/>
  </g>

  <!-- Kopf mit Maske. -->
  <g class="sneak__head">
    <circle cx="82" cy="52" r="34" fill="#3a2450" stroke="#1A1024" stroke-width="7"/>
    <rect x="50" y="40" width="64" height="20" rx="10" fill="#1A1024"/>
    <circle cx="68" cy="50" r="5" fill="#fff8e7"/>
    <circle cx="96" cy="50" r="5" fill="#fff8e7"/>
    <path d="M70 70q12 8 24 0" fill="none" stroke="#1A1024" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
