<?xml version="1.0" encoding="UTF-8"?>
<!-- Krater (Art Direction §4.1): tiefer als ein Loch, mit Russring am Rand. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 136" width="128" height="136">
  <rect x="6" y="6" width="116" height="116" rx="14" fill="#2B1B10" stroke="#1A1024" stroke-width="6"/>
  <ellipse cx="64" cy="68" rx="48" ry="38" fill="#1A1024"/>
  <!-- Russ: ausgefranster Rand, kein sauberer Kreis -->
  <g fill="#1A1024" opacity="0.7">
    <circle cx="20" cy="40" r="10"/><circle cx="108" cy="46" r="9"/>
    <circle cx="30" cy="104" r="8"/><circle cx="100" cy="100" r="7"/>
    <circle cx="64" cy="22" r="8"/>
  </g>
</svg>
