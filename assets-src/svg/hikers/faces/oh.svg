<?xml version="1.0" encoding="UTF-8"?>
<!-- Gesicht "oh" — DIE Signatur des Spiels (ADR-3): grosse Augen, kleiner runder Mund.
     Der Moment, in dem zwei merken, dass sie auf demselben Balken stehen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" width="96" height="64">
  <ellipse cx="27" cy="24" rx="16" ry="18" fill="#FFFFFF" stroke="#1A1024" stroke-width="5"/>
  <ellipse cx="69" cy="24" rx="16" ry="18" fill="#FFFFFF" stroke="#1A1024" stroke-width="5"/>
  <circle cx="30" cy="27" r="8" fill="#1A1024"/>
  <circle cx="66" cy="27" r="8" fill="#1A1024"/>
  <!-- Winziger Lichtpunkt: macht das Erschrecken lesbar statt leer. -->
  <circle cx="33" cy="23" r="2.5" fill="#FFFFFF"/>
  <circle cx="69" cy="23" r="2.5" fill="#FFFFFF"/>
  <ellipse cx="48" cy="52" rx="7" ry="8" fill="#1A1024"/>
</svg>
