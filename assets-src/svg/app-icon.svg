<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Der Tresor</title>
  <!--
    App-Icon: die Tresortür von vorn (Art Direction §4.2).
    Dicke ink-Outlines, Cel-Shading, kein Verlauf auf dem Metall.
    Quelle für public/icons/* — gebaut mit `npm run build:icons`.
    Liegt bewusst neben den Kategorie-Ordnern, nicht darin: Das Icon gehoert in keinen Atlas.
  -->
  <rect width="512" height="512" fill="#0B0A14" />

  <!-- Türblatt -->
  <circle cx="256" cy="256" r="180" fill="#1A1024" />
  <circle cx="256" cy="256" r="170" fill="#8C93A8" />
  <!-- Cel-Shading: eine harte Kante auf der abgewandten Seite, kein Verlauf -->
  <path d="M256 86 A170 170 0 0 1 256 426 Z" fill="#4A506A" opacity="0.45" />

  <!-- Nietenkranz -->
  <g fill="#4A506A" stroke="#1A1024" stroke-width="6">
    <circle cx="256" cy="116" r="12" />
    <circle cx="355" cy="157" r="12" />
    <circle cx="396" cy="256" r="12" />
    <circle cx="355" cy="355" r="12" />
    <circle cx="256" cy="396" r="12" />
    <circle cx="157" cy="355" r="12" />
    <circle cx="116" cy="256" r="12" />
    <circle cx="157" cy="157" r="12" />
  </g>

  <!-- Goldring um das Zahlenrad -->
  <circle cx="256" cy="256" r="108" fill="none" stroke="#1A1024" stroke-width="22" />
  <circle cx="256" cy="256" r="108" fill="none" stroke="#FFC93C" stroke-width="12" />

  <!-- Griffrad -->
  <g stroke="#1A1024" stroke-width="16" stroke-linecap="round">
    <line x1="256" y1="176" x2="256" y2="336" />
    <line x1="176" y1="256" x2="336" y2="256" />
    <line x1="199" y1="199" x2="313" y2="313" />
    <line x1="313" y1="199" x2="199" y2="313" />
  </g>
  <g stroke="#FFC93C" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="176" x2="256" y2="336" />
    <line x1="176" y1="256" x2="336" y2="256" />
    <line x1="199" y1="199" x2="313" y2="313" />
    <line x1="313" y1="199" x2="199" y2="313" />
  </g>

  <!-- Nabe -->
  <circle cx="256" cy="256" r="44" fill="#1A1024" />
  <circle cx="256" cy="256" r="34" fill="#FFC93C" />
  <circle cx="256" cy="256" r="14" fill="#C9961A" />
</svg>
